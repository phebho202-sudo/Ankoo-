<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empire Studio AI</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="icon.svg" alt="" width="34" height="34">
        <div>
          <div class="brand-name">Empire Studio <span>AI</span></div>
          <div class="brand-sub" id="brandChannel">Behind the Fortune</div>
        </div>
      </div>
      <nav id="nav" aria-label="Dashboard sections"></nav>
      <div class="sidebar-foot">Local studio &middot; YouTube not connected</div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <div class="topbar-title">
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSub"></p>
        </div>
        <div class="topbar-actions" id="pageActions"></div>
      </header>
      <div class="demo-banner" id="demoBanner" hidden>
        <strong>Demo data</strong> Items marked <span class="badge demo">DEMO</span> are invented samples so you can see how the studio works.
        <a href="#/settings">Remove them in Settings</a>
      </div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="modal"><form id="modalForm" method="dialog"></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
