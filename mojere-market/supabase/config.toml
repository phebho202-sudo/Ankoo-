# Settings for the Supabase CLI (optional; the dashboard can be used instead).
# Paystack calls the webhook without a Supabase login, so JWT checks are off
# for that function only. Its Paystack signature check protects it instead.
[functions.paystack-webhook]
verify_jwt = false

[functions.paystack-initialize]
verify_jwt = true

# Called by a Database Webhook with a shared secret header, not a user login.
[functions.send-push]
verify_jwt = false
